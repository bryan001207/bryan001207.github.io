name: Deploy Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: gh-pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.pages-deploy.outputs.page_url }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Inject
        env:
          AB980A: ${{ secrets.AB980A }}
          B9B84D: ${{ secrets.B9B84D }}
        run: |
          python3 -c "
          import os, sys, pathlib
          tag_a = os.environ.get('AB980A', '')
          tag_b = os.environ.get('B9B84D', '')
          fpath = pathlib.Path('index.html')
          orig = fpath.read_text(encoding='utf-8')
          updated = orig
          if tag_a:
              updated = updated.replace('<!-- e00db9c597389f3b907318d6b5fd87 -->', tag_a)
          if tag_b:
              updated = updated.replace('<!-- b0df25781814e42dd9fd127031ff883890f9052b33fdd0a3 -->', tag_b)
          if updated == orig and (tag_a or tag_b):
              sys.exit(1)
          if updated != orig:
              fpath.write_text(updated, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: pages-deploy
        uses: actions/deploy-pages@v4
